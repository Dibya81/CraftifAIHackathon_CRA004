<text x="455" y="92" font-size="12" font-weight="700" fill="#4A5963" text-anchor="middle">PERCEPTION (PIPEGEN)</text>
<text x="885" y="92" font-size="12" font-weight="700" fill="#4A5963" text-anchor="middle">DECISION AND PRESENTATION</text>
