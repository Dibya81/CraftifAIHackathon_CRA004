<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 800" width="1170" height="800" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2A33"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FD0"/></marker></defs>
<rect width="1170" height="800" fill="#FFFFFF"/>
<text x="30" y="38" font-size="24" font-weight="700" fill="#1E2A33">SiteSentinel architecture</text>
<text x="30" y="58" font-size="13" fill="#4A5963">PipeGen perception engine, rule engine, evidence and dashboard</text>
