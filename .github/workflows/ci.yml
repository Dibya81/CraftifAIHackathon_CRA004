name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "dashboard/package-lock.json"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Dashboard dependencies
        run: |
          npm --prefix dashboard ci

      - name: Static Analysis & Type Checking
        run: |
          make lint

      - name: Run Python Unit & Property Tests
        run: |
          pytest -v --durations=10

      - name: Check Dashboard TypeScript and Unit Tests
        run: |
          npm --prefix dashboard run check

      - name: Install Playwright Chromium
        run: |
          npx --prefix dashboard playwright install --with-deps chromium

      - name: Build Dashboard Production Bundle
        run: |
          npm --prefix dashboard run build

      - name: Run Playwright E2E and Accessibility Tests
        run: |
          npm --prefix dashboard run test:e2e

      - name: Run Claims and Text Audit
        run: |
          python tools/audit_claims.py

      - name: Verify Claims Ledger
        run: |
          python tools/ledger.py verify

      - name: Run Automated Judge Pipeline
        run: |
          make judge

      - name: Upload Judge Verification Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-verification-artifacts
          path: |
            JUDGE_REPORT.md
            REQUIREMENTS_MATRIX.md
            reports/perf/
            evidence/ledger.yaml
